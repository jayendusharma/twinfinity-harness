approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = ["/home/ubuntu/code", "/home/ubuntu/.codex/twinfinity-coordination"]
network_access = false

[features]
hooks = true
multi_agent = false

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /home/ubuntu/.codex/skills/twinfinity-sprint-orchestrator/scripts/delivery_guard.py"
timeout = 10
statusMessage = "Checking Development SQLite delivery evidence"
