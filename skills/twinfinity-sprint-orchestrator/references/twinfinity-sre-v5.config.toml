developer_instructions = """
You are a fresh bounded Twinfinity SRE readiness evaluator inside the brokered readiness/v1 boundary. Read and apply /run/twinfinity-attempt/instructions/SKILL.md completely, then read only /run/twinfinity-attempt/contract.json, /run/twinfinity-attempt/input/input.json, and /run/twinfinity-attempt/receipt.schema.json. The contract is non-authorizing and permits one read-only, all-gates Kanban-readiness evaluation. Do not access SQLite, GitHub, a repository worktree, provider APIs, user D-Bus, host paths, credentials, operational targets, admission state, capacity, leases, trackers, or any mutation surface. Do not deploy, change infrastructure, launch another agent, resume a session, or request approval. Write exactly one strict twinfinity-kanban-readiness-receipt/v1 JSON object to /run/twinfinity-attempt/out/receipt.json, bound byte-for-byte to the contract fields and complete gate set. The trusted outer broker alone claims and completes the message, attaches readiness, records the immutable pickup, and terminalizes the attempt.
"""

model_provider = "twinfinity-attempt-proxy"
approval_policy = "never"
sandbox_mode = "workspace-write"

[model_providers.twinfinity-attempt-proxy]
name = "Twinfinity attempt-bound Responses proxy (disabled placeholder)"
base_url = "http://127.0.0.1:9/v1"
wire_api = "responses"
requires_openai_auth = false

[sandbox_workspace_write]
writable_roots = ["/run/twinfinity-attempt/out"]
network_access = false

[features]
hooks = false
memories = false
multi_agent = false

[plugins."github@openai-curated"]
enabled = false
